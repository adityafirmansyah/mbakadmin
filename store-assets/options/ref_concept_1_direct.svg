<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <!-- Solid Background: Deep Electric Violet -->
  <rect width="512" height="512" rx="115" fill="#6D28D9"/>
  <!-- Subtle Circular Frame for contrast -->
  <circle cx="256" cy="265" r="185" fill="#5B21B6"/>

  <!-- Back Inner Hair Glow: Bright Electric Cyan (#22D3EE) peeking behind cheeks & neck -->
  <path d="M 140 230 C 120 340, 140 430, 185 465 L 256 480 L 327 465 C 372 430, 392 340, 372 230 Z" fill="#22D3EE"/>
  <!-- Dark inner shadow layer between inner cyan and white outer hair -->
  <path d="M 150 240 C 135 340, 150 420, 190 450 L 256 465 L 322 450 C 362 420, 377 340, 362 240 Z" fill="#0F172A"/>

  <!-- Shoulders & Cyber Suit (Crisp White & Dark Charcoal with Cyan Accent) -->
  <path d="M 140 512 L 180 435 L 256 455 L 332 435 L 372 512 Z" fill="#0F172A"/>
  <!-- White Shoulder Armor Plates -->
  <path d="M 140 512 L 180 435 L 210 442 L 175 512 Z" fill="#FFFFFF"/>
  <path d="M 372 512 L 332 435 L 302 442 L 337 512 Z" fill="#FFFFFF"/>
  <!-- Center Cyan Chest Node -->
  <polygon points="230,448 256,460 282,448 270,490 256,498 242,490" fill="#22D3EE"/>
  <circle cx="256" cy="475" r="5" fill="#FFFFFF"/>

  <!-- High Collar & Neck -->
  <path d="M 232 350 L 232 440 C 248 446, 264 446, 280 440 L 280 350 Z" fill="#F8FAFC"/>
  <!-- Tech Collar Seam (Solid Cyan) -->
  <rect x="238" y="400" width="36" height="8" rx="4" fill="#22D3EE"/>

  <!-- Face Shape: Soft Chibi Rounded Porcelain Jawline -->
  <path d="M 172 215 C 172 135, 340 135, 340 215 C 340 305, 296 375, 256 385 C 216 375, 172 305, 172 215 Z" fill="#FFF7ED"/>

  <!-- Cheeks: Soft Chibi Pink Blush -->
  <ellipse cx="204" cy="298" rx="15" ry="9" fill="#FB7185"/>
  <ellipse cx="308" cy="298" rx="15" ry="9" fill="#FB7185"/>

  <!-- Stoic / Gentle Little Smile (Like reference) -->
  <path d="M 248 328 Q 256 334 264 328" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

  <!-- EYES: Enormous Luminous Cyan Anime Eyes (Faithful to Reference) -->
  <!-- Left Eye -->
  <g>
    <!-- Upper Lash Line: Bold charcoal with pink edge -->
    <path d="M 190 248 C 200 230, 226 230, 238 246" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M 190 246 C 200 228, 226 228, 238 244" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <!-- Outer Lower Lash -->
    <path d="M 196 268 C 204 278, 224 278, 232 268" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- Iris: Solid Luminous Aqua / Cyan -->
    <ellipse cx="214" cy="256" rx="18" ry="24" fill="#06B6D4"/>
    <ellipse cx="214" cy="260" rx="15" ry="18" fill="#22D3EE"/>
    <!-- Dark Inner Pupil -->
    <ellipse cx="214" cy="252" rx="9" ry="12" fill="#0F172A"/>
    <!-- Glassy Catchlights -->
    <circle cx="207" cy="244" r="6.5" fill="#FFFFFF"/>
    <circle cx="222" cy="264" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Eye -->
  <g>
    <!-- Upper Lash Line -->
    <path d="M 274 246 C 286 230, 312 230, 322 248" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>
    <path d="M 274 244 C 286 228, 312 228, 322 246" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <!-- Outer Lower Lash -->
    <path d="M 280 268 C 288 278, 308 278, 316 268" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- Iris -->
    <ellipse cx="298" cy="256" rx="18" ry="24" fill="#06B6D4"/>
    <ellipse cx="298" cy="260" rx="15" ry="18" fill="#22D3EE"/>
    <!-- Dark Inner Pupil -->
    <ellipse cx="298" cy="252" rx="9" ry="12" fill="#0F172A"/>
    <!-- Glassy Catchlights -->
    <circle cx="291" cy="244" r="6.5" fill="#FFFFFF"/>
    <circle cx="306" cy="264" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Eyebrows (Pale Slate / Platinum) -->
  <path d="M 196 218 Q 212 210 228 216" fill="none" stroke="#64748B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 284 216 Q 300 210 316 218" fill="none" stroke="#64748B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- WHITE / PLATINUM FRONT HAIR & BANGS (Reference Bob Style) -->
  <!-- Left Side Framing Lock -->
  <path d="M 166 190 C 160 250, 168 310, 185 345 C 195 320, 192 260, 188 200 Z" fill="#FFFFFF"/>
  <path d="M 180 290 L 185 345 L 195 320 Z" fill="#22D3EE"/> <!-- Inner cyan peak on tip -->

  <!-- Right Side Framing Lock -->
  <path d="M 346 190 C 352 250, 344 310, 327 345 C 317 320, 320 260, 324 200 Z" fill="#FFFFFF"/>
  <path d="M 332 290 L 327 345 L 317 320 Z" fill="#22D3EE"/> <!-- Inner cyan peak on tip -->

  <!-- Crown and Blunt Bangs with Parting -->
  <path d="M 166 190 C 175 110, 337 110, 346 190 L 332 205 L 315 200 L 295 224 L 285 200 L 260 228 L 248 200 L 225 226 L 210 200 L 190 206 Z" fill="#FFFFFF"/>

  <!-- Cyan Crown Accent Streak (Echoing reference hair) -->
  <path d="M 235 155 Q 256 145 280 152" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>

  <!-- WHITE SCI-FI OPERATOR HEADSET -->
  <!-- Left Earpiece (Glossy White Armor with Cyan Core & Pivot) -->
  <g transform="translate(136, 235)">
    <circle cx="0" cy="0" r="30" fill="#0F172A"/>
    <circle cx="0" cy="0" r="23" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
  </g>

  <!-- Right Earpiece (White Sci-Fi Module with Operator Boom Mic) -->
  <g transform="translate(376, 235)">
    <circle cx="0" cy="0" r="30" fill="#0F172A"/>
    <circle cx="0" cy="0" r="23" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
    <!-- Mic Boom (Clean White & Charcoal Arm) -->
    <path d="M -6 16 Q -30 60 -80 70 L -100 72" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
    <path d="M -6 16 Q -30 60 -80 70 L -100 72" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Capsule -->
    <rect x="-118" y="63" width="20" height="18" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <circle cx="-108" cy="72" r="4" fill="#22D3EE"/>
  </g>
</svg>