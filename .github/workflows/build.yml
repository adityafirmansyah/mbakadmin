name: Build Android APK & Release Bundle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Release & Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/mbakadmin-release.jks

      - name: Build Signed Release APK & Bundle (AAB)
        env:
          KEYSTORE_FILE: keystore/mbakadmin-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean Keystore File
        if: always()
        run: rm -rf keystore/*.jks

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mbakadmin-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: mbakadmin-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mbakadmin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
